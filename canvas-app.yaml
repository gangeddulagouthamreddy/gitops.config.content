apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canvas
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gangeddulagouthamreddy/gitops.config.content.git
    targetRevision: master
    path: project2
  destination:
    server: https://kubernetes.default.svc
    namespace: canvas
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
